{% extends "base.html" %}
{% block title %}Login - ExamVault{% endblock %}
{% block head %}
  <link href="{{ url_for('static', filename='login.css') }}" rel="stylesheet">
  <script src="{{ url_for('static', filename='login.js') }}" defer></script>
{% endblock %}
{% block content %}
<div class="neu-login">
  <div class="neu-card">
    <div class="neu-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5a5 5 0 0 0-5 5V9H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6.5a5 5 0 0 0-5-5Zm-3 5a3 3 0 0 1 6 0V9H9V6.5Zm3 6.5a1.75 1.75 0 0 1 .9 3.25V18a.9.9 0 0 1-1.8 0v-1.75A1.75 1.75 0 0 1 12 13Z"/></svg>
    </div>
    <h1 class="neu-title">ExamVault</h1>
    <p class="neu-sub">Secure exam paper system</p>

    <form class="neu-form" method="post" action="/login" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="neu-field">
        <label class="neu-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" type="text" maxlength="150" required autofocus>
      </div>
      <div class="neu-field has-eye">
        <label class="neu-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" maxlength="256" required autocomplete="current-password">
        <button class="neu-eye" type="button" data-target="password" aria-label="Show password" aria-pressed="false">
          <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 5.1A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg>
        </button>
      </div>
      <button class="btn neu-btn" type="submit">Login</button>
    </form>

    <p class="neu-help">Forgot Password? Contact admin</p>
  </div>
  <p class="neu-foot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
    Two-factor authentication required
  </p>
</div>
{% endblock %}
