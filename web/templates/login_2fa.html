{% extends "base.html" %}
{% block title %}Two-factor verification - ExamVault{% endblock %}
{% block head %}
  <link href="{{ url_for('static', filename='login.css') }}" rel="stylesheet">
  <script src="{{ url_for('static', filename='login_2fa.js') }}" defer></script>
{% endblock %}
{% block content %}
<div class="neu-login">
  <div class="neu-card" id="2fa-card">
    
    <!-- OTP Form Section -->
    <div id="otp-section">
      <div class="neu-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 class="neu-title">Enter Access Code</h1>
      <p class="neu-sub">Apni authenticator app ka 6-digit code dalo</p>

      <form class="neu-form" id="otp-form" method="post" action="/login/2fa" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="code" id="full-code">
        
        <!-- Separate 6 digit inputs -->
        <div class="otp-container">
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autofocus required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
        </div>

        <button class="btn neu-btn" type="submit" id="verify-btn">Verify Code</button>
      </form>

      <p class="neu-help"><a href="/login" class="neu-link">Back to login</a></p>
    </div>

    <!-- Verifying / Rotating Animation Section (Initially Hidden) -->
    <div id="verifying-section" class="d-none">
      <h2 class="neu-title">Verifying...</h2>
      <p class="neu-sub">Securely checking your credentials</p>

      <div class="spinner-wrapper">
        <div class="rotating-circle"></div>
        <div class="orbiting-box box-1"></div>
        <div class="orbiting-box box-2"></div>
        <div class="orbiting-box box-3"></div>
        <span class="percentage-text" id="verify-percent">0%</span>
      </div>
    </div>

  </div>
</div>
{% endblock %}
