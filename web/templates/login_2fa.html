{% extends "base.html" %}
{% block title %}Two-factor verification - ExamVault{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4">Two-factor verification</h1>
        <p class="text-muted">Apni authenticator app ka 6-digit code dalo</p>
        <form method="post" action="/login/2fa" autocomplete="off">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="code">6-digit code</label>
            <input class="form-control form-control-lg text-center" id="code" name="code" type="text"
                   inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code" required autofocus>
          </div>
          <button class="btn btn-primary w-100" type="submit">Verify</button>
        </form>
        <p class="mt-3 mb-0"><a href="/login">Back to login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
